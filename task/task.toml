[task]
name = "dynamo/migrate-geodetic-archive"
description = "Recover an unpublished geodetic datum transformation from blunder-contaminated tie points and migrate a legacy survey archive to WGS84."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Processing and ETL"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Geospatial data processing"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
task_objective = ["migrate", "transform", "validate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 6

difficulty_explanation = """
Every country that has moved off a local datum has paid someone to do this job.
The awkward version, and a common one in older archives, is that the
transformation to WGS84 was never written down, so it has to be pulled back out of
the register before a single record can be moved. Agency geodesists and cadastral
GIS staff do this work, and the three outputs asked for here are what they hand
over at the end of it: the parameters, the migrated register, and a QA sheet
showing which control was used and how well it fitted.

The difficulty is geodetic rather than programmatic. A transformation of this kind
lives in geocentric Cartesian space, so the legacy positions have to go through
the legacy ellipsoid on the way in. Its constants are in the shipped format spec,
and its semi-major axis is 841 m off WGS84. Take a familiar default instead and
every recovered parameter is out by more than a hundred metres while the residuals
still look reasonable, which is the sort of error that survives review. The legacy
positions also arrive in three encodings: packed sexagesimal, decimal degrees, and
plane coordinates on a local Transverse Mercator grid. The plane subset has to
come back through an inverse projection on that same legacy ellipsoid before it is
any use. Heights are a second trap. The archived heights are orthometric over a
local mean sea level datum, while both the transformation and the requested output
are ellipsoidal, so the separation grid has to be interpolated and applied. Leave
it out and the horizontal work still checks out while every height is wrong by
about 38 m. The seven parameters are also reported under a named sign convention,
and the two conventions in use differ by the sign of all three rotations.

The estimation is where a plausible attempt is most likely to come apart. Some of
the legacy tie coordinates were miskeyed by hand: transposed seconds, a flipped
hemisphere letter, decimal degrees typed into a sexagesimal field, an easting and
northing the wrong way round, a kilometre slip. Least squares has no defence
against errors that size. One station kilometres out of place spreads itself
across every residual, so the obvious move of fitting once and reading the
residuals fingers the wrong stations, and can settle on a parameter set that fits
the bad control and throws away the good. Getting past that means seeing that the
blunders have to be cut on something that never sees a least squares solution, and
setting the cut from the spread of the data in hand rather than from a remembered
rule of thumb.

The errors are not all loud, either, and that is where the work is. They run down a
ladder: kilometres, then 27 m, 8 m, 3 m, 2.5 m, and finally 1.5 m. A robust screen
of the raw difference vectors has to tolerate a couple of metres of honest scatter,
so it clears the loud ones and leaves four of the quiet ones sitting in the
adjustment. They only become visible afterwards, in the residuals of a fit that is
already clean, where the honest floor is four tenths of a metre. So the cut that
separates them has to be read off the residual spread in hand. A remembered figure
in the low metres, the sort of number that sounds right, sails past the smallest of
them and leaves a station carrying a metre and a half of error in the parameters.
There is no ambiguity about it once the fit is clean, since the smallest blunder
still stands at eight sigma, but there is also no comfortable margin: the cut has
to land between four tenths of a metre and one and a half, and nothing in the
prompt says where. Do the file handling well and the adjustment badly and the
output is tidy, plausible and wrong, which is the failure this task is built to
catch.

The data is synthetic, built from an invented island datum, so no parameter set,
station or answer is retrievable online. The extents, ellipsoid, grid definition,
geoid gradient, the decimetre level GNSS noise on the modern side and the list of
transcription errors are all modelled on real national archives of the period.
"""

solution_explanation = """
Start with /app/data/FORMAT.txt. It is normative, and it carries the legacy
ellipsoid (a = 6377295.664 m, 1/f = 300.8017), the local Transverse Mercator
definition, the record layout with its three coordinate encodings and two height
units, the continuation line and void marker rules, and the note that tie point
heights are already ellipsoidal while archive heights are orthometric.

Recover the transformation before touching the register. Decode each tie station's
legacy field according to its encoding, running the type P stations back through an
inverse Transverse Mercator on the legacy ellipsoid, then put both sides into
geocentric Cartesian coordinates, the legacy side on the legacy ellipsoid and the
GNSS side on WGS84.

Cut the bad control first. Over a region this small the rotation and scale terms
only move a station a few metres relative to its neighbours, so the raw difference
vectors of the honest stations sit in a tight cluster around their component-wise
median, while a miskeyed one leaves the cluster by whatever the keying error was
worth. Screening those difference vectors on a median absolute deviation scale,
with a floor at the level honest scatter can reach, separates the gross errors
cleanly. It also never touches a least squares solution, which is why it survives
the blunders it is looking for. On this archive it picks out six stations and
leaves four.

One screening pass is nowhere near enough. The four it leaves are worth 1.5, 2.5,
3.1 and 8 m, all of them inside the couple of metres of honest scatter the screen
has to tolerate, so no threshold on that statistic can separate them. They are only
distinguishable after the adjustment, where the honest residuals top out at 0.43 m
and the smallest blunder sits at 1.61 m. Snoop the post-fit residuals, drop the
worst, refit, and repeat until nothing stands out.

The cut for that loop is the delicate part, and it has to come from the residuals
rather than from habit. Scale it to their robust spread and floor it near the
decimetre the prompt gives for the GNSS side; a floor around half a metre sits
comfortably between the honest 0.43 m and the smallest blunder at 1.61 m. Reach
instead for a round couple of metres, which is a perfectly natural number to pick,
and the 1.5 m station stays in the fit and the rejected set comes out one short.

Adjust what is left for the seven parameters. Linearised about the identity, the
observation equations are linear in the three translations, the three small
rotations and the scale, so a single solve is enough; running the full non-linear
model through a couple of iterations costs nothing and settles the question. Keep
the rotations in the position vector sense the prompt names, and carry the arc
second and part per million factors in the design matrix so the normal matrix
stays well conditioned. Snoop the post-fit residuals once at the metre level to
check nothing subtler is left. The adjustment settles at about 0.19 m 3D RMS,
which is what decimetre GNSS should give, and is the sign that the right stations
went out.

Then run the register through it. Assemble records across continuation lines, drop
anything with a void coordinate or height field, decode positions by record type
and heights in decimetres or centimetres by record type, take each orthometric
height to ellipsoidal by bilinear interpolation of the separation grid, transform,
and convert back to geodetic coordinates on WGS84. Report the parameters, the
migrated FeatureCollection, and the QA figures: topocentric residuals for the
stations kept, their 3D RMS, the stations rejected, and the void records left out.
"""

verification_explanation = """
Ground truth sits only in tests/ground_truth.json, overlaid at verify time. It
holds the generating parameters, the identifiers of the seven miskeyed stations and
the thirty void records, and the true WGS84 position, ellipsoidal height, archived
orthometric height and full name of all 1170 complete records. The verifier reads
nothing but the three files instruction.md asks for. Fifteen tests cover one stated
requirement each.

datum_params.json is checked for the seven documented numeric keys, then each
translation, each rotation and the scale go against the generating values. Formal
standard deviations from the adjustment on clean control are 2.2 to 2.7 m on the
translations, 0.06 to 0.08 arc seconds on the rotations and 0.27 ppm on the scale.
The seven parameters of a small region similarity transformation are correlated, so
the bands have to bracket parameter uncertainty rather than the much tighter
coordinate uncertainty. They are set at 10.0 m, 0.35 arc seconds and 1.0 ppm,
roughly four sigma, and were checked both ways rather than against the reference
solution alone. Other defensible adjustments stay well inside: dropping the two
largest surviving residuals gives 2.2 m and 0.084 arc seconds, using only twelve
tie stations gives 4.2 m, 0.155 arc seconds and 0.226 ppm. The methodological
failures land well outside: a translation only shift gives 73 m and 2.42 arc
seconds, taking the legacy side through the WGS84 ellipsoid gives 139 m and
110 ppm, reporting rotations under the coordinate frame convention misses by 4.84
arc seconds, and leaving the blunders in misses by kilometres. Each of those was
written out as a full set of output files and put through this verifier: the
defensible ones scored 1, the failures scored 0.

The rejected station set is compared for exact equality, and the two populations do
not overlap, so a sound method has nothing borderline to disagree about. Against a
clean fit the honest residuals run from 0.03 m to 0.43 m and the ten blunders from
1.61 m upward, so any cut placed between those two figures returns the same set. It
does not matter at which stage a given station is removed, or whether the solver
screens the raw difference vectors first at all; only that the final cut lands in
that window.

The window is deliberately narrow, and it is the point of the task rather than a
hazard to it. The smallest blunder stands at eight sigma against the honest
residual spread, so a cut scaled to that spread, or floored near the decimetre the
instruction gives for the GNSS observations, lands inside it comfortably. A cut
carried in from habit at a round couple of metres does not, and returns nine
stations instead of ten. That is graded by test_blunder_stations_rejected alone:
the parameters of such a fit are still within tolerance and its RMS still inside
the band, so the set comparison is doing the work, which is why it is compared
exactly rather than by count.

Nothing the verifier grades against is read from a path the agent can write to.
The tie stations it certifies residuals against are recorded in ground truth when
the archive is built, not re-read from /app/data/tiepoints.csv, which sits on the
agent's own filesystem; checking the reported residuals against a file the agent
could have rewritten would certify nothing. The only agent-side paths the verifier
opens are the three outputs it is asked to produce.

Reported residuals are checked for coverage, present for every station kept and
absent for every one rejected, then for self consistency. Each east, north, up
triple is recomputed from the reported parameters and the recorded tie stations
and compared as a whole vector within 0.05 m, allowing an overall sign flip so
either direction convention passes. The comparison is deliberately not on
magnitude alone: any triple of the right length would satisfy that, including a
fabricated one that puts the whole residual on a single axis and so reports a
zero vertical and zero north component for stations that have neither.

rms_residual_m has to match the RMS of the reported triples to within 1 percent
and fall in [0.02, 1.00] m, since an adjustment of decimetre quality GNSS control
cannot fit much better or much worse than that.

Every numeric field is required to be finite. NaN compares False against any
bound, so a check phrased as "flag it when the error exceeds the tolerance" would
accept NaN silently; the tests either assert the passing condition directly or go
through a finiteness helper.

archive_wgs84.geojson is checked as a FeatureCollection of Point features with
three ordinates and the three documented properties, then on content. Record
membership has to equal the complete record set exactly, with n_records_migrated
agreeing, and excluded_record_ids has to equal the void set exactly, with
n_records_excluded_void agreeing. That pair is what catches mishandling of the
void markers or the continuation lines, either of which throws the record count
out. Horizontal error is graded at 0.30 m RMS and 0.75 m worst case: the reference
gives 0.018 m RMS, the loosest defensible variant tried 0.052 m, and the nearest
failure 0.894 m RMS with 1.54 m worst case, so the band sits about six times above
the sound spread and three times below the nearest failure. Ellipsoidal height is
graded at 1.50 m RMS and 4.00 m worst case: the reference gives 0.033 m, nearest
neighbour interpolation of the separation grid gives 0.378 m RMS and 1.26 m worst
case, and ignoring the grid gives 38.4 m. Nearest neighbour is a defensible reading
even though the model documents bilinear, so the band lets any reasonable
interpolation through and still rejects skipping the step by a factor of twenty
five. height_orthometric_m goes against the archived value within 0.05 m, which is
what shows the decimetre and centimetre units were read per record type. Names are
compared with whitespace runs collapsed, so assembling the continuation lines is
graded without hanging on how the segments are joined.

Nothing in the task depends on a live service or on random state. The data is fixed
in the image and the dependencies are pinned.
"""

[verifier]
timeout_sec = 180.0
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

